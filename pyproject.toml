[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dualai"
version = "1.0.0"
description = "High-performance Dual-AI IPC Bridge linking Gemini Antigravity with OpenAI ChatGPT."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "mutagen>=1.47.0"
]

[project.scripts]
dualai = "dualai.cli:main"
